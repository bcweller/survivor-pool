server {
    listen 80;
    server_name _;

    include snippets/security-headers.conf;
    client_max_body_size 10m;

    location /meal-tracker/ {
        proxy_pass http://127.0.0.1:3004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /meal-tracker;
    }

    location /meal-tracker {
        return 301 /meal-tracker/;
    }

    location /dartscorer/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dartscorer {
        return 301 /dartscorer/;
    }

    location /recipebox/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recipebox {
        return 301 /recipebox/;
    }

    # survivor-pool is a Next.js app configured with basePath: '/survivor-pool'
    # (see next.config.js), so unlike the other apps above, the full path
    # must be forwarded UNCHANGED — proxy_pass has no trailing URI here on
    # purpose. Next.js itself expects to see the /survivor-pool prefix on
    # incoming requests, strips it internally for routing, and issues its
    # own redirect between /survivor-pool and /survivor-pool/ (canonical
    # home route has no trailing slash) — so no bare-path 301 here, unlike
    # the other apps above. Adding one creates a redirect loop.
    #
    # This location also overrides the shared CSP (below) to allow images
    # from ESPN's CDN — the landing page and pick board both load team
    # logos directly from a.espncdn.com via plain <img> tags. nginx doesn't
    # let a location merge with server-level add_header directives: once a
    # location defines its own, it must redeclare all of them, not just the
    # one being changed — that's why every header from
    # snippets/security-headers.conf is repeated here.
    location /survivor-pool {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # script-src needs 'unsafe-inline': Next.js App Router hydrates via
        # inline `<script>self.__next_f.push(...)</script>` blocks on every
        # page (its RSC streaming payload) — without this, the browser
        # silently refuses to run them, the page renders but never
        # hydrates, and every button/link goes dead with no visible error.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://a.espncdn.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
